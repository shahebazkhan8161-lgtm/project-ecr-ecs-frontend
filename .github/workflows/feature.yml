name: "Feature — PR Validation"

# Sirf PR pe chalta hai — koi deploy nahi
# feature/* → develop ke PR pe lint + build check
on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # PR pe comment karne ke liye

jobs:

  # ── Validate build ────────────────────────────────────
  build-check:
    name: "Docker build check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker build (no push)
        run: |
          docker build -t ecr-ecs-frontend:pr-${{ github.event.pull_request.number }} .
          echo "Docker build successful — image NOT pushed to ECR"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: [
                '### Frontend PR Check',
                '',
                '| Check | Status |',
                '| --- | --- |',
                '| Docker build | passed |',
                '',
                `PR: **${context.payload.pull_request.head.ref}** → **${context.payload.pull_request.base.ref}**`,
                '',
                '_Note: Image will be built and pushed to ECR only after merge._'
              ].join('\n')
            });
